name: traveldesk

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: traveldesk/backend:latest
    container_name: traveldesk-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      APP_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080,http://localhost:4000
      # SQLite file lives on a named volume so data survives rebuilds.
      DATABASE_URL: file:/app/data/traveldesk.db
      UPLOAD_DIR: /app/data/uploads
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-please-change-me-000000000000}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-please-change-me-000000000000}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: "30"
      SEED_ON_START: "true"
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-owner@horizontravel.in}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-Traveldesk@123}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
    volumes:
      - traveldesk-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  traveldesk-data:
