# Local development database — Postgres in Docker, nothing else.
#
#   docker compose -f docker-compose.dev.yml up -d
#   npm run prisma:push      # create/update the tables
#   npm run dev
#
# Publishing host port 5433 (not 5432) so it never collides with a native
# Postgres service that may already be running on this machine.
name: traveldesk-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: traveldesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: traveldesk
      POSTGRES_PASSWORD: traveldesk
      POSTGRES_DB: traveldesk
    ports:
      - "5433:5432"
    volumes:
      - traveldesk-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveldesk -d traveldesk"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  traveldesk-dev-pgdata:
