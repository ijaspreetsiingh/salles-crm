<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>JassDBX Sales CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ── TOKENS ── */
:root{
  --bg:#ebe8e1;--solid:#f6f4ef;--float:#fdfcf9;
  --glass:rgba(255,255,255,.46);--glass-2:rgba(255,255,255,.65);--glass-3:rgba(255,255,255,.90);
  --well:rgba(23,25,26,.06);--line:rgba(23,25,26,.09);--line-2:rgba(23,25,26,.16);--rim:rgba(255,255,255,.78);
  --mesh-a:#f2d3bd;--mesh-b:#cfdfcd;--mesh-c:#f1e4bf;
  --text:#17191a;--muted:#676a66;--faint:#8e918c;
  --butter:#f2c94c;--on-butter:#17191a;
  --pine:#2f5c50;--on-pine:#fbf8f2;
  --tomato:#c8431f;--on-tomato:#fbf8f2;
  --ink:#17191a;--on-ink:#fbf8f2;
  --dock:#17191a;--on-dock:#fbf8f2;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 24px 48px -30px rgba(70,50,30,.28);
  --shadow-pop:0 24px 60px -18px rgba(40,30,20,.32),0 2px 6px rgba(40,30,20,.08);
  --r-card:26px;--ease:cubic-bezier(.2,.8,.2,1);
}
[data-theme="dark"]{
  --bg:#111412;--solid:#1c201e;--float:#242927;
  --glass:rgba(255,255,255,.05);--glass-2:rgba(255,255,255,.09);--glass-3:#222624;
  --well:rgba(255,255,255,.06);--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.16);--rim:rgba(255,255,255,.08);
  --mesh-a:rgba(200,67,31,.28);--mesh-b:rgba(47,92,80,.5);--mesh-c:rgba(242,201,76,.1);
  --text:#f1eee8;--muted:#a3a6a0;--faint:#7d807b;
  --ink:#f1eee8;--on-ink:#17191a;--tomato:#d8532d;
  --dock:rgba(255,255,255,.08);--on-dock:#f1eee8;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 24px 48px -30px rgba(0,0,0,.7);
  --shadow-pop:0 24px 60px -18px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08);
}
</style>
<style>
/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-family:"Urbanist",ui-sans-serif,system-ui;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:500 14px/1.5 "Urbanist",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s var(--ease),color .4s var(--ease)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
ul,ol{list-style:none}
svg{display:block;flex-shrink:0}
input,select,textarea{font:inherit;color:var(--text)}
/* ── MESH ── */
.mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.mesh i{border-radius:50%;position:absolute;filter:blur(60px);opacity:.95;animation:fmesh 20s var(--ease) infinite alternate}
.mesh-a{background:radial-gradient(closest-side,var(--mesh-a),transparent);width:62vmax;height:62vmax;top:-24vmax;left:-18vmax}
.mesh-b{background:radial-gradient(closest-side,var(--mesh-b),transparent);width:70vmax;height:70vmax;bottom:-30vmax;right:-24vmax;animation-delay:-7s}
.mesh-c{background:radial-gradient(closest-side,var(--mesh-c),transparent);width:46vmax;height:46vmax;top:-16vmax;right:8vmax;animation-delay:-14s}
@keyframes fmesh{0%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.08)}100%{transform:translate(-40px,45px) scale(.96)}}
/* ── APP SHELL ── */
.app{position:relative;z-index:1;display:flex;min-height:100vh}
/* ── SIDEBAR ── */
.sidebar{width:230px;flex-shrink:0;background:var(--dock);color:var(--on-dock);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40;transition:background .4s var(--ease)}
.sidebar::-webkit-scrollbar{width:0}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{width:36px;height:36px;border-radius:10px;background:var(--butter);color:var(--on-butter);display:grid;place-items:center;font-size:16px;font-weight:800;flex-shrink:0}
.sb-name{font-size:15px;font-weight:700;opacity:.92}
.sb-badge{margin-left:auto;background:var(--pine);color:var(--on-pine);font-size:9px;font-weight:700;border-radius:6px;padding:2px 6px;letter-spacing:.04em}
.sb-sec{padding:12px 10px 4px}
.sb-sec-title{font-size:10px;font-weight:700;letter-spacing:.08em;opacity:.45;padding:0 8px;margin-bottom:4px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;width:100%;font-size:13px;font-weight:600;opacity:.72;transition:all .18s var(--ease);color:var(--on-dock);position:relative;cursor:pointer}
.nav-item:hover{opacity:1;background:rgba(255,255,255,.09)}
.nav-item.active{opacity:1;background:rgba(255,255,255,.13)}
.nav-item.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:2px;background:var(--butter)}
.nav-arrow{margin-left:auto;opacity:.4;transition:transform .2s}
.nav-item.open .nav-arrow{transform:rotate(90deg)}
.nav-sub{overflow:hidden;max-height:0;transition:max-height .28s var(--ease)}
.nav-sub.open{max-height:200px}
.nav-sub .nav-item{font-size:12.5px;padding:7px 10px 7px 30px;opacity:.6}
.nav-sub .nav-item:hover{opacity:.9}
.nav-sub .nav-item.active{opacity:1}
.sb-sep{height:1px;background:rgba(255,255,255,.08);margin:8px 14px}
.sb-user{padding:12px 14px;margin-top:auto;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .18s}
.sb-user:hover{background:rgba(255,255,255,.06)}
.sb-av{width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0;display:grid;place-items:center;font-weight:700;font-size:13px}
.sb-av img{width:100%;height:100%;object-fit:cover}
.sb-uname{font-size:13px;font-weight:700}
.sb-urole{font-size:11px;opacity:.55}
</style>
<style>
/* ── MAIN ── */
.main{flex:1;min-width:0;padding:0 26px 48px}
/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;gap:10px;padding:16px 0 14px;position:sticky;top:0;z-index:30;background:linear-gradient(to bottom,var(--bg) 75%,transparent);backdrop-filter:blur(0)}
.tb-title{font-size:20px;font-weight:800;letter-spacing:-.02em;flex:1}
.tb-title span{color:var(--muted);font-weight:600;font-size:13px;margin-left:6px}
.search-btn{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--glass-2);border:1px solid var(--rim);color:var(--muted);font-size:13px;font-weight:600;box-shadow:var(--shadow);backdrop-filter:blur(12px);transition:all .18s var(--ease)}
.search-btn:hover{background:var(--glass-3);color:var(--text)}
.search-btn kbd{background:var(--well);border:1px solid var(--line-2);border-radius:6px;padding:2px 6px;font-size:10px;font-family:inherit;color:var(--faint)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--rim);box-shadow:var(--shadow);color:var(--text);transition:all .18s var(--ease);backdrop-filter:blur(12px);position:relative;flex-shrink:0}
.icon-btn:hover{transform:scale(1.05);background:var(--glass-3)}
.icon-btn:active{transform:scale(.96)}
.icon-btn .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--tomato);border:2px solid var(--bg)}
.create-btn{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--ink);color:var(--on-ink);font-size:13px;font-weight:700;transition:all .18s var(--ease);box-shadow:0 4px 12px rgba(0,0,0,.2);white-space:nowrap}
.create-btn:hover{transform:scale(1.02)}
.create-btn:active{transform:scale(.98)}
/* ── GLASS CARD ── */
.card{background:var(--glass);border:1px solid var(--rim);border-radius:var(--r-card);padding:22px;box-shadow:var(--shadow);backdrop-filter:blur(14px);transition:transform .28s var(--ease),box-shadow .28s var(--ease)}
.card:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.85) inset,0 28px 56px -24px rgba(70,50,30,.32)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:15px;font-weight:700}
.card-actions{display:flex;align-items:center;gap:6px}
.flat-btn{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--glass-2);border:1px solid var(--line-2);color:var(--muted);transition:all .18s;flex-shrink:0}
.flat-btn:hover{color:var(--text);background:var(--glass-3)}
/* ── SEG CONTROL ── */
.seg{display:inline-flex;background:var(--well);border-radius:999px;padding:4px}
.seg-btn{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted);transition:all .18s}
.seg-btn.active{background:var(--float);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.seg-btn:hover:not(.active){color:var(--text)}
/* ── CHIP ── */
.chip{height:34px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--glass-2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;transition:all .18s;cursor:pointer;color:var(--text)}
.chip:hover{background:var(--glass-3)}
.chip.active{background:var(--ink);color:var(--on-ink);border-color:transparent}
/* ── AVATAR ── */
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av-pine{background:rgba(47,92,80,.15);color:var(--pine)}
.av-tomato{background:rgba(200,67,31,.18);color:var(--tomato)}
.av-butter{background:rgba(242,201,76,.35);color:#7a5f0a}
.av-ink{background:rgba(23,25,26,.10);color:var(--text)}
.av-stack{display:flex}
.av-stack .av{margin-left:-6px;border:2px solid var(--solid)}
.av-stack .av:first-child{margin-left:0}
/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px;white-space:nowrap}
.badge-green{background:rgba(47,92,80,.12);color:var(--pine)}
.badge-yellow{background:rgba(242,201,76,.25);color:#7a5f0a}
.badge-red{background:rgba(200,67,31,.12);color:var(--tomato)}
.badge-ink{background:rgba(23,25,26,.08);color:var(--text)}
.badge-pine{background:var(--pine);color:var(--on-pine)}
.badge-butter{background:var(--butter);color:var(--on-butter)}
.badge-tomato{background:var(--tomato);color:var(--on-tomato)}
[data-theme="dark"] .badge-green{background:rgba(47,92,80,.3);color:#6ec9b0}
[data-theme="dark"] .badge-yellow{color:var(--butter)}
/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
/* ── SEARCH INPUT ── */
.search-input{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--glass-2);border:1px solid var(--rim);font-size:13px;font-weight:600;color:var(--text);box-shadow:var(--shadow);backdrop-filter:blur(12px)}
.search-input input{background:none;border:none;outline:none;font:600 13px/1 "Urbanist",sans-serif;color:var(--text);width:160px}
.search-input input::placeholder{color:var(--muted)}
/* ── STAT CARD ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi-card{background:var(--glass);border:1px solid var(--rim);border-radius:var(--r-card);padding:18px 20px;box-shadow:var(--shadow);backdrop-filter:blur(14px);transition:transform .28s var(--ease)}
.kpi-card:hover{transform:translateY(-3px)}
.kpi-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.kpi-row{display:flex;align-items:flex-start;justify-content:space-between}
.kpi-val{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:6px 0}
.kpi-sub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.kpi-icon{width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
</style>
